<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>6ixify Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 40px 32px;
      max-width: 480px;
    }

    h1 {
      color: #FFD700;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .sub {
      color: #555;
      font-size: 13px;
      margin-bottom: 36px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input {
      flex: 1;
      padding: 10px 14px;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      color: #f0f0f0;
      font-size: 14px;
      outline: none;
      font-family: 'Menlo', 'Monaco', monospace;
    }

    input:focus { border-color: #FFD700; }

    .btn-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    #saveBtn {
      background: #FFD700;
      color: #0d0d0d;
    }

    #saveBtn:hover { opacity: 0.85; }

    #toggleBtn {
      background: #1e1e1e;
      color: #666;
      border: 1px solid #2a2a2a;
    }

    #toggleBtn:hover { color: #aaa; }

    #msg {
      font-size: 12px;
      color: #4caf50;
      margin-top: 10px;
      min-height: 18px;
    }

    #msg.error { color: #ff6b6b; }

    .hint {
      margin-top: 28px;
      font-size: 12px;
      color: #3a3a3a;
      line-height: 1.6;
      border-top: 1px solid #1a1a1a;
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <h1>6ixify</h1>
  <p class="sub">Toronto Slang Translator — Settings</p>

  <label>Anthropic API Key</label>
  <div class="input-row">
    <input type="password" id="apiKey" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">
  </div>
  <div class="btn-row">
    <button id="saveBtn">Save Key</button>
    <button id="toggleBtn">Show</button>
  </div>
  <div id="msg"></div>

  <p class="hint">
    Your key is stored locally in your browser via <code>chrome.storage.local</code>.
    It's only sent directly to Anthropic's API when you convert a page.
    Never shared anywhere else, fam.
  </p>

  <script src="options.js"></script>
</body>
</html>
